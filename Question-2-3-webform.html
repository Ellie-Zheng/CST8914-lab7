<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Form validation with messages on top: Code example - Accessibility Developer Guide example</title>
        <meta charset="utf-8">
        <style>.control, fieldset {
      margin: 6px 0;
    }
    
    label {
      display: inline-block;
      width: 120px;
      vertical-align: top;
    }
    
    input + label {
      width: auto;
    }
    
    .error, .required {
      color: red;
    }
    
    fieldset ul {
      margin: 0;
    }</style>
    </head>
    <body>
        <h1>Feedback form</h1>
    <form>
        <div class="control">
          <!-- Added for attributes to labels to associate them with the matching form control IDs. Also added (required) to field labels to identify required fields in text -->
          <label for="name">Full name (required)</label><input id="name" name="name" type="text" />
        </div>
        <div class="control">
          <label for="biography">Biography (required)<br>
            <span>Include examples on your skills in JavaScript.</span>
          </label>
          <!-- Included the biography instructions in the label so screen readers can read them with the field name. -->
          <textarea id="biography" name="biography" type="text"></textarea>
          <!-- Suggest removing type="text" because it is not a valid attribute for textarea. -->  
        </div>

        <!-- Grouped the gender radio buttons in a fieldset and used a legend to name the group. -->
        <fieldset>
          <legend>Gender (required)</legend>
          <div class="control">
            <input id="gender_male" name="gender" type="radio" value="male" /><label for="gender_male">Male</label>
          </div>
          <div class="control">
            <input id="gender_female" name="gender" type="radio" value="female" /><label for="gender_female">Female</label>
          </div>
        </fieldset>

        <div class="control">
          <input id="accept_agbs" name="accept_agbs" type="checkbox" value="1" /><label for="accept_agbs">I accept the terms and conditions (required)</label>
        </div>
        <div class="control">
          <input name="validate" type="hidden" value="1" /><input type="submit" value="Register" />
        </div>
      </form>
      
          <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js" integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8=" crossorigin="anonymous"></script>
          <script>"use strict";
      
      ;
      (function () {
        var validateInput;
      
        $.urlParam = function (name) {
          var results;
          results = new RegExp('[?&]' + name + '=([^&#]*)').exec(window.location.href);
      
          if (results === null) {
            return null;
          } else {
            return decodeURI(results[1]) || null;
          }
        };
      
        validateInput = function validateInput(input, message) {
          var $elementToDescribe, $error, $errorContainer, $fieldset, $input, $referencedElement, value;
          $input = $('[name="' + input + '"]');
      
          if ((value = $.urlParam(input)) === null) {
            if ($('fieldset.errors').length === 0) {
              $('form').prepend('<fieldset class="errors"><legend>Errors</legend><ul></ul></fieldset>');
            }
      
            $referencedElement = null;
            $elementToDescribe = null;
            $errorContainer = $('fieldset.errors ul');
      
            if ($input.is(':radio')) {
              $fieldset = $input.closest('fieldset');
              $elementToDescribe = $fieldset;
              $referencedElement = $input.filter(':first');
            } else {
              $elementToDescribe = $input;
              $referencedElement = $input;
            }
      // R.G. hint: fix next line ;)
            // Added href so keyboard users can reach each error link and activate it to focus the related field. The $referencedElement.attr('id') gets the ID of the field with the error.
            // $error = $('<a href="#' + $referencedElement.attr('id') + '">' + message + '</a>');
            // Added an ID matching the field's aria-describedby so screen readers can read the error message as the field's description.
            $error = $('<a href="#' + $referencedElement.attr('id') + '" id="' + input + '_description">' + message + '</a>');
            $error.click(function (e) {
              // If we rely on the link's href pointing to the input's ID, it doesn't trigger forms mode in screen readers
              $referencedElement.focus();
              return e.preventDefault();
            });
            $elementToDescribe.attr('aria-describedby', input + '_description');
            $errorContainer.append('<li>').find('li:last').append($error);
      
            if ($(':not(body):focus').length === 0) {
              // Changed form to body to exclude the default body focus when checking for a focused element.
              // Move focus to the first error link so users can notice the errors and navigate to the related field.
              // See https://stackoverflow.com/questions/46134247/jquery-setting-focus-doesnt-work-in-ie11/
              $errorContainer.find('a').first().focus();            
            }
          } else {
            if ($input.is(':checkbox')) {
              $input.attr('checked', true);
            }
      
            if ($input.is(':radio')) {
              return $input.filter('[value="' + value + '"]').attr('checked', true);
            } else {
              return $input.val(value);
            }
          }
        };
      
        $(document).ready(function () {
          if ($.urlParam('validate')) {
            validateInput('name', 'Please enter your name!');
            validateInput('biography', 'Please tell us something about your history!');
            validateInput('gender', 'Please tell us your gender!');
            validateInput('accept_agbs', 'You must accept our terms and conditions!');

            // Changed .error to .errors to check the actual error container before showing the success alert.
            if ($('.errors').length === 0) {
              return alert('All inputs are valid.');
            }
          }
        });
      }).call(void 0);</script>
                
        </body>
      </html>
